[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PythonTools"
dynamic = ["version"]
description = "Shared cross-platform utilities for Linktech Engineering tooling ecosystem."
authors = [
    { name = "Leon McClatchey", email = "ldmcclatchey@linktechengineering.net" }
]
requires-python = ">=3.12"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9",
    "pysnmp>=7.0",
    "requests>=2.31",
    "paramiko>=3.4"
]
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["PythonTools*"]
exclude = ["tests*", "data*", "archive*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true